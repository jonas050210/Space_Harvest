[project]
name = "space-harvest"
version = "1.6.0"
description = "Orbital farming on real launch windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long integration tests; run the fast loop with -m 'not slow'",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Real defects only (unused/undefined names, bugbear patterns); no style churn.
select = ["E4", "E7", "E9", "F", "B"]
