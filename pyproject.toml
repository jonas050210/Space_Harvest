[project]
name = "space-harvest"
version = "1.6.2"
description = "Orbital farming on real launch windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ursina>=6.0.0",
    "numpy>=1.26",
    "pillow>=10.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff",
    "matplotlib>=3.8",
    "pyinstaller>=6.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
space-harvest = "src.app:run_game"
space-harvest-headless = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long integration tests; run the fast loop with -m 'not slow'",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Real defects only (unused/undefined names, bugbear patterns); no style churn.
select = ["E4", "E7", "E9", "F", "B"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
